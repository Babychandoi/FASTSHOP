services:
  mysql:
    image: mysql:8.0
    container_name: fastshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345678}
      MYSQL_DATABASE: fast_shop
      TZ: Asia/Ho_Chi_Minh
    command:
      - --lower_case_table_names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-12345678}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: fastshop-app
    container_name: fastshop-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fast_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-12345678}
      APP_SEED_ENABLED: "true"
      APP_SECRET: ${APP_SECRET:-}
      # Email được gửi vào Mailpit (xem tại http://localhost:8025), không ra Internet
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-not-configured}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-not-configured}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: fastshop-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  mysql_data:
  uploads:
