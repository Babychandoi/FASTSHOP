<div th:fragment="subfragment" class="page-wrapper">
  <div class="account-layout" ng-controller="changed-ctrl">
    <div th:replace="~{layout/_sidebar_user :: sidebar('profile')}"></div>

    <div class="account-content">
      <div class="alert alert-danger" th:if="${param.updateError != null}">
        Không cập nhật được thông tin. Email có thể đã được sử dụng bởi tài khoản khác.
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Hồ sơ của tôi</h3>
        </div>
        <form method="post" th:action="@{/auth/update}" th:object="${item}">
          <div class="card-body">
            <div class="row g-4">
              <div class="col-lg-3 text-center">
                <span class="avatar avatar-xl rounded-circle bg-primary-lt fw-bold mb-2" style="font-size: 2rem;"
                      th:text="${item.fullname != null and !#strings.isEmpty(item.fullname)} ? ${#strings.toUpperCase(#strings.substring(item.fullname.trim(), item.fullname.trim().lastIndexOf(' ') + 1, item.fullname.trim().lastIndexOf(' ') + 2))} : 'U'">U</span>
                <div class="fw-bold" th:text="${item.fullname}"></div>
                <div class="text-muted fs-5" th:text="${'@' + item.username}"></div>
              </div>
              <div class="col-lg-9">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <input class="form-control" th:field="*{username}" readonly type="text">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="fullname">Họ và tên</label>
                    <input class="form-control" th:field="*{fullname}" readonly type="text">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="phone">Số điện thoại</label>
                    <input class="form-control" th:field="*{phone}" type="tel" pattern="(0|\+84)[0-9]{9}" title="Số điện thoại gồm 10 số, bắt đầu bằng 0 hoặc +84" placeholder="VD: 0912345678">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" th:field="*{email}" type="email" placeholder="VD: ten@email.com" autocomplete="off">
                  </div>
                </div>
                <div class="form-hint mt-2">Tên đăng nhập và họ tên không thể thay đổi.</div>
              </div>
            </div>
          </div>
          <div class="card-footer d-flex justify-content-end gap-2">
            <a href="#" data-bs-toggle="modal" data-bs-target="#modal-change-logged" class="btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>
              Đổi mật khẩu
            </a>
            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
          </div>
        </form>
      </div>
    </div>

    <!-- modal đổi mật khẩu -->
    <div class="modal modal-blur fade" id="modal-change-logged" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Đổi mật khẩu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
          </div>
          <div class="modal-body">
            <label class="form-label required">Mật khẩu hiện tại</label>
            <input type="password" ng-model="pass1" class="form-control" placeholder="Nhập mật khẩu hiện tại" autocomplete="current-password">
            <span class="error fs-5">{{error1}}</span>
            <label class="form-label required mt-3">Mật khẩu mới</label>
            <input type="password" ng-model="pass2" class="form-control" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
            <span class="error fs-5">{{error2}}</span>
            <label class="form-label required mt-3">Nhập lại mật khẩu mới</label>
            <input type="password" ng-model="pass3" class="form-control" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
            <span class="error fs-5">{{error3}}</span>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn me-auto" id="cancel-change-pw" data-bs-dismiss="modal">Hủy</button>
            <button type="button" ng-click="change()" class="btn btn-primary">Đổi mật khẩu</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <link th:href="@{/dist/css/profile.css}" rel="stylesheet"/>
</div>
