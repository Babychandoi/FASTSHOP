<div th:fragment="subfragment" class="page-wrapper">
  <div class="container-xl py-4" ng-controller="history-ctrl">

    <div class="mb-3">
      <h2 class="page-title mb-1">Lịch sử hoạt động</h2>
      <div class="text-muted">Các thao tác quản trị và báo cáo nhân viên đã gửi.</div>
    </div>

    <div class="card">
      <div class="card-header">
        <label class="form-check mb-0 me-3" title="Chọn tất cả">
          <input type="checkbox" class="form-check-input" ng-model="all" ng-change="choose_all()" ng-disabled="histories.length == 0">
          <span class="form-check-label">Chọn tất cả</span>
        </label>
        <span class="text-muted" ng-cloak>{{histories.length}} mục<span ng-if="selectedIds().length"> · đã chọn {{selectedIds().length}}</span></span>
        <div class="card-actions">
          <button type="button" class="btn btn-sm btn-outline-danger" ng-click="delete()" ng-disabled="selectedIds().length == 0">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
              <line x1="4" y1="7" x2="20" y2="7"></line>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
              <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"></path>
              <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"></path>
            </svg>
            Xóa mục đã chọn
          </button>
        </div>
      </div>

      <div class="list-group list-group-flush" ng-cloak>
        <div class="list-group-item" ng-repeat="history in histories track by history.id" ng-class="{'bg-light': selected[history.id]}">
          <div class="row align-items-center g-3">
            <div class="col-auto">
              <input type="checkbox" class="form-check-input m-0" ng-model="selected[history.id]" ng-change="syncAll()" aria-label="Chọn mục">
            </div>
            <div class="col-auto">
              <span class="avatar avatar-sm bg-red-lt" ng-if="history.link">PDF</span>
              <span class="avatar avatar-sm bg-blue-lt" ng-if="!history.link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clock-history" viewBox="0 0 16 16">
                  <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0v1z"/>
                  <path d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5z"/>
                </svg>
              </span>
            </div>
            <div class="col text-truncate">
              <a ng-if="history.link" ng-href="{{history.link}}" target="_blank" class="text-reset d-block text-truncate" title="Mở file báo cáo">{{history.title}}</a>
              <span ng-if="!history.link" class="d-block text-truncate">{{history.title}}</span>
              <div class="text-muted small">
                {{history.schedual | date:'dd/MM/yyyy HH:mm'}}
                <span ng-if="history.account"> · {{history.account.fullname}}</span>
              </div>
            </div>
            <div class="col-auto">
              <button type="button" class="btn btn-sm btn-ghost-secondary" ng-click="remove(history.id)" title="Xóa mục này" aria-label="Xóa mục này">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                  <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="list-group-item text-center text-muted py-4" ng-if="loaded && histories.length == 0">Chưa có hoạt động nào.</div>
      </div>
    </div>
  </div>
</div>
