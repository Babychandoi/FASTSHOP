<div th:fragment="subfragment" class="page-wrapper">
  <div class="account-layout">
    <div th:replace="~{layout/_sidebar_user :: sidebar('notify')}"></div>

    <div class="account-content" ng-controller="mode-cart-ctrl">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Thông báo của tôi</h3>
        </div>

        <div class="empty" th:if="${notify_all == null or notify_all.isEmpty()}">
          <div class="empty-icon text-muted">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/></svg>
          </div>
          <p class="empty-title">Chưa có thông báo nào</p>
          <p class="empty-subtitle text-muted">Thông báo về đơn hàng và ưu đãi sẽ hiển thị tại đây.</p>
        </div>

        <div class="list-group list-group-flush" th:unless="${notify_all == null or notify_all.isEmpty()}">
          <div class="list-group-item" th:each="n : ${notify_all}">
            <div class="row align-items-center">
              <div class="col-auto">
                <span class="status-dot d-block" th:classappend="${n.status} ? 'status-dot-animated bg-red' : 'bg-secondary'"></span>
              </div>
              <div class="col-auto">
                <span class="avatar bg-blue-lt">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"></path></svg>
                </span>
              </div>
              <div class="col">
                <div th:classappend="${n.status} ? 'fw-bold'" th:text="${n.title}"></div>
                <div class="text-muted fs-5">[[${#dates.format(n.sentDate, 'dd/MM/yyyy')}]]</div>
              </div>
              <div class="col-auto d-flex gap-2">
                <a href="/user/myorder" class="btn btn-sm btn-outline-primary" th:if="${#strings.containsIgnoreCase(n.title, 'đơn hàng') or #strings.containsIgnoreCase(n.title, 'đặt hàng')}">Xem đơn hàng</a>
                <a href="/user/discount" class="btn btn-sm btn-outline-primary" th:if="${#strings.containsIgnoreCase(n.title, 'voucher') or #strings.containsIgnoreCase(n.title, 'ưu đãi')}">Xem ưu đãi</a>
                <button type="button" class="btn btn-sm btn-ghost-secondary" th:if="${n.status}" th:attr="ng-click=|update_status(${n.id})|">Đánh dấu đã đọc</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <link th:href="@{/dist/css/profile.css}" rel="stylesheet" />
</div>
