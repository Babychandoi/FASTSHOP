<div th:fragment="subfragment" class="page-wrapper">
  <div class="account-layout">
    <div th:replace="~{layout/_sidebar_user :: sidebar('address')}"></div>

    <div class="account-content">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Sổ địa chỉ</h3>
          <div class="card-actions">
            <a href="#" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-address-add">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z"/></svg>
              Thêm địa chỉ mới
            </a>
          </div>
        </div>

        <!-- chưa có địa chỉ -->
        <div class="empty" th:if="${addresses == null or addresses.isEmpty()}">
          <div class="empty-icon text-muted">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16"><path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 0 1 8 14.58a31.481 31.481 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94zM8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10z"/><path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
          </div>
          <p class="empty-title">Bạn chưa có địa chỉ giao hàng</p>
          <p class="empty-subtitle text-muted">Thêm địa chỉ để đặt hàng nhanh hơn.</p>
        </div>

        <div class="list-group list-group-flush" th:unless="${addresses == null or addresses.isEmpty()}">
          <div class="list-group-item py-3" th:each="add : ${addresses}">
            <div class="row align-items-center">
              <div class="col">
                <div class="d-flex align-items-center gap-2 mb-1">
                  <strong th:text="${auth.account.fullname}"></strong>
                  <span class="text-muted">|</span>
                  <span class="text-muted" th:text="${auth.account.phone}"></span>
                  <span class="badge bg-green-lt ms-2" th:if="${add.choose}">Mặc định</span>
                </div>
                <div class="text-secondary" th:text="${add.place}"></div>
              </div>
              <div class="col-auto">
                <form method="post" action="/user/address/update" th:unless="${add.choose}" class="m-0">
                  <input type="hidden" name="place" th:value="${add.id}">
                  <button type="submit" class="btn btn-outline-primary btn-sm">Đặt làm mặc định</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- modal thêm địa chỉ -->
  <div class="modal modal-blur fade" id="modal-address-add" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <form class="modal-content" method="post" action="/user/address/add" id="form-2">
        <div class="modal-header">
          <h5 class="modal-title">Thêm địa chỉ giao hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label required" for="place">Địa chỉ nhận hàng</label>
            <textarea class="form-control" rows="3" name="place" id="place" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố"></textarea>
            <div class="form-message text-start text-danger mt-1"></div>
          </div>
          <div class="text-muted fs-5 mt-2" th:if="${addresses == null or addresses.isEmpty()}">Địa chỉ đầu tiên sẽ được đặt làm mặc định.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn me-auto" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu địa chỉ</button>
        </div>
      </form>
    </div>
  </div>

  <script th:src="@{/dist/js/validate.js}"></script>
  <script>
    Validator({
      form: '#form-2',
      errorElement: '.form-message',
      rules: [
        Validator.isRequired('#place', 'Vui lòng nhập địa chỉ nhận hàng'),
      ]
    })
  </script>
  <link th:href="@{/dist/css/profile.css}" rel="stylesheet" />
</div>
