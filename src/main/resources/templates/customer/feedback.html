<div th:fragment="subfragment" class="page-wrapper">
  <div class="account-layout">
    <div th:replace="~{layout/_sidebar_user :: sidebar('feedback')}"></div>

    <div class="account-content">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Đánh giá của tôi</h3>
          <div class="card-actions text-muted" th:if="${commentList.size() > 0}">[[${commentList.size()}]] đánh giá</div>
        </div>

        <div class="empty" th:if="${commentList.size() == 0}">
          <div class="empty-icon text-muted">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16"><path d="M5 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm4 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/><path d="m2.165 15.803.02-.004c1.83-.363 2.948-.842 3.468-1.105A9.06 9.06 0 0 0 8 15c4.418 0 8-3.134 8-7s-3.582-7-8-7-8 3.134-8 7c0 1.76.743 3.37 1.97 4.6a10.437 10.437 0 0 1-.524 2.318l-.003.011a10.722 10.722 0 0 1-.244.637c-.079.186.074.394.273.362a21.673 21.673 0 0 0 .693-.125zm.8-3.108a1 1 0 0 0-.287-.801C1.618 10.83 1 9.468 1 8c0-3.192 3.004-6 7-6s7 2.808 7 6c0 3.193-3.004 6-7 6a8.06 8.06 0 0 1-2.088-.272 1 1 0 0 0-.711.074c-.387.196-1.24.57-2.634.893a10.97 10.97 0 0 0 .398-2z"/></svg>
          </div>
          <p class="empty-title">Bạn chưa có đánh giá nào</p>
          <p class="empty-subtitle text-muted">Hãy chia sẻ cảm nhận về sản phẩm bạn đã mua ở trang chi tiết sản phẩm.</p>
        </div>

        <div class="list-group list-group-flush" th:if="${commentList.size() > 0}">
          <div class="list-group-item py-3" th:each="e : ${commentList}">
            <div class="row">
              <div class="col-auto">
                <a th:href="@{${'/user/detail/' + e.product.id}}">
                  <img th:src="@{${'/dist/img/products/' + e.product.image}}" class="rounded border" width="64" height="64" style="object-fit: contain;" alt="">
                </a>
              </div>
              <div class="col">
                <div class="d-flex justify-content-between align-items-start gap-3">
                  <a class="fw-bold" th:href="@{${'/user/detail/' + e.product.id}}" th:text="${e.product.name}"></a>
                  <span class="text-muted fs-5 text-nowrap">[[${#dates.format(e.datePost, 'dd/MM/yyyy')}]]</span>
                </div>
                <div class="my-1">
                  <th:block th:replace="~{layout/_rating :: rate(${e.rate})}"></th:block>
                </div>
                <div class="text-secondary" th:text="${e.feedback}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <link th:href="@{/dist/css/profile.css}" rel="stylesheet" />
</div>
