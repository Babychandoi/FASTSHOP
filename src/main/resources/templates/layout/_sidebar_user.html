<!-- Menu bên trái dùng chung cho các trang tài khoản của khách hàng. active = mục đang chọn -->
<div th:fragment="sidebar(active)" class="card account-sidebar" th:with="isCustomer=${auth == null or auth.role.id == 'USER'}">
  <div class="card-body d-flex align-items-center border-bottom py-3" th:if="${auth != null}">
    <span class="avatar avatar-md rounded-circle bg-primary-lt me-3 fw-bold"
          th:text="${auth.account.fullname != null and !#strings.isEmpty(auth.account.fullname)} ? ${#strings.toUpperCase(#strings.substring(auth.account.fullname.trim(), auth.account.fullname.trim().lastIndexOf(' ') + 1, auth.account.fullname.trim().lastIndexOf(' ') + 2))} : 'U'">U</span>
    <div class="text-truncate">
      <div class="fw-bold text-truncate" th:text="${auth.account.fullname}"></div>
      <div class="text-muted fs-5 text-truncate" th:text="${'@' + auth.account.username}"></div>
    </div>
  </div>
  <div class="list-group list-group-flush">
    <a th:unless="${isCustomer}" th:href="${auth.role.id == 'ADMIN'} ? '/admin/home' : '/staff/home'" class="list-group-item list-group-item-action">
      ← Về trang quản lý
    </a>
    <a href="/user/myorder" th:if="${isCustomer}" class="list-group-item list-group-item-action" th:classappend="${active == 'order'} ? 'active'">

      Đơn hàng của tôi
    </a>
    <a href="/profile" class="list-group-item list-group-item-action" th:classappend="${active == 'profile'} ? 'active'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zm12 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1v-1c0-1-1-4-6-4s-6 3-6 4v1a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12z"/></svg>
      Tài khoản của tôi

      Đánh giá của tôi
    </a>
    <a href="/user/notify" th:if="${isCustomer}" class="list-group-item list-group-item-action" th:classappend="${active == 'notify'} ? 'active'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/></svg>
      Thông báo
    </a>
    <a href="/user/discount" th:if="${isCustomer}" class="list-group-item list-group-item-action" th:classappend="${active == 'discount'} ? 'active'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M6 4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-1 0a.5.5 0 1 0-1 0 .5.5 0 0 0 1 0z"/><path d="M2 1h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 1 6.586V2a1 1 0 0 1 1-1zm0 5.586 7 7L13.586 9l-7-7H2v4.586z"/></svg>
      Mã giảm giá
    </a>
    <a href="/user/address" th:if="${isCustomer}" class="list-group-item list-group-item-action" th:classappend="${active == 'address'} ? 'active'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 0 1 8 14.58a31.481 31.481 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94zM8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10z"/><path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
      Sổ địa chỉ
    </a>
    <a href="/user/wallet" th:if="${isCustomer}" class="list-group-item list-group-item-action" th:classappend="${active == 'wallet'} ? 'active'">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-1a1 1 0 0 0-1 1v1h14V4a1 1 0 0 0-1-1H2zm13 4H1v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7z"/><path d="M2 10a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-1z"/></svg>
      Thẻ thanh toán
    </a>
    <a th:href="${isCustomer} ? '/logout' : '/company/logout'" class="list-group-item list-group-item-action text-danger">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M7.5 1v7h1V1h-1z"/><path d="M3 8.812a4.999 4.999 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812z"/></svg>

  </div>
</div>
