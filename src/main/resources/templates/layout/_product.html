<!-- Thẻ sản phẩm dùng chung (trang chủ, tìm kiếm, chi tiết, giỏ hàng). item = Product -->
<a th:fragment="card(item)" th:href="@{|/user/detail/${item.id}|}" class="card product-card">
  <div class="product-thumb">
    <img th:src="@{${'/dist/img/products/' + item.image}}" th:alt="${item.name}" loading="lazy">
  </div>
  <div class="card-body p-3">
    <div class="product-name" th:text="${item.name}" th:title="${item.name}"></div>
    <div class="mt-2 d-flex flex-wrap align-items-center gap-1 text-muted fs-5" th:with="r=${ratings != null ? ratings[item.id] : null}">
      <th:block th:replace="~{layout/_rating :: stars(${r})}"></th:block>
      <span th:if="${r != null}" class="text-nowrap">[[${#numbers.formatDecimal(r[0], 1, 1)}]] ([[${#numbers.formatInteger(r[1], 1)}]])</span>
      <span th:if="${r == null}" class="text-nowrap">Chưa có đánh giá</span>
    </div>
    <div class="mt-2">
      <th:block th:replace="~{layout/_rating :: price(${item})}"></th:block>
    </div>
  </div>
</a>
