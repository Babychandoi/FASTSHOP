server.port=8000
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fast_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ? Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# APP
# URL công khai của site (dùng cho link trong email)
app.base-url=${APP_BASE_URL:http://localhost:8000}
# Khóa ký cookie đăng nhập & link đặt lại mật khẩu (để trống: sinh ngẫu nhiên mỗi lần khởi động)
app.secret=${APP_SECRET:}
# Thư mục lưu ảnh sản phẩm / file báo cáo được upload
app.upload-dir=${APP_UPLOAD_DIR:uploads}
# Nạp dữ liệu demo (db/seed.sql) khi database còn trống
app.seed.enabled=${APP_SEED_ENABLED:false}
# MAIL (mặc định Gmail; Docker Compose chuyển sang Mailpit để test)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail-from=${MAIL_FROM:no-reply@fastshop.vn}

# GOOGLE / FACEBOOK OAuth2 (khai báo trong .env)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:not-configured}
